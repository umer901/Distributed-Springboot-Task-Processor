spring:
  application:
    name: distributed-task-processor
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tasks}
    username: ${SPRING_DATASOURCE_USERNAME:task_user}
    password: ${SPRING_DATASOURCE_PASSWORD:task_password}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      pool-name: task-processor-pool
  flyway:
    enabled: true
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:task_user}
    password: ${SPRING_RABBITMQ_PASSWORD:task_password}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

task-processor:
  runtime:
    api-enabled: ${TASK_PROCESSOR_API_ENABLED:true}
    worker-enabled: ${TASK_PROCESSOR_WORKER_ENABLED:true}
    outbox-enabled: ${TASK_PROCESSOR_OUTBOX_ENABLED:true}
  idempotency:
    ttl-days: 7
  rabbitmq:
    exchange: task.processor.exchange
    queue: task.processor.work
    routing-key: task.work
    dead-letter-queue: task.processor.dead-letter
  outbox:
    batch-size: ${TASK_PROCESSOR_OUTBOX_BATCH_SIZE:25}
    publish-delay-millis: ${TASK_PROCESSOR_OUTBOX_DELAY_MS:1000}
  worker:
    id: ${TASK_PROCESSOR_WORKER_ID:${HOSTNAME:local-worker}}
    prefetch: ${TASK_PROCESSOR_WORKER_PREFETCH:4}
    recovery-batch-size: ${TASK_PROCESSOR_RECOVERY_BATCH_SIZE:25}
    recovery-delay-millis: ${TASK_PROCESSOR_RECOVERY_DELAY_MS:5000}
  retry:
    initial-backoff-millis: ${TASK_PROCESSOR_RETRY_INITIAL_MS:1000}
    max-backoff-millis: ${TASK_PROCESSOR_RETRY_MAX_MS:30000}
    multiplier: ${TASK_PROCESSOR_RETRY_MULTIPLIER:2.0}
