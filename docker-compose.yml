services:
  api:
    build:
      context: .
    image: distributed-task-processor:local
    container_name: task-processor-api
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tasks
      SPRING_DATASOURCE_USERNAME: task_user
      SPRING_DATASOURCE_PASSWORD: task_password
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: task_user
      SPRING_RABBITMQ_PASSWORD: task_password
      TASK_PROCESSOR_API_ENABLED: "true"
      TASK_PROCESSOR_WORKER_ENABLED: "false"
      TASK_PROCESSOR_OUTBOX_ENABLED: "false"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    image: distributed-task-processor:local
    container_name: task-processor-worker
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tasks
      SPRING_DATASOURCE_USERNAME: task_user
      SPRING_DATASOURCE_PASSWORD: task_password
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: task_user
      SPRING_RABBITMQ_PASSWORD: task_password
      TASK_PROCESSOR_API_ENABLED: "false"
      TASK_PROCESSOR_WORKER_ENABLED: "true"
      TASK_PROCESSOR_OUTBOX_ENABLED: "true"
      TASK_PROCESSOR_WORKER_ID: compose-worker-1
    ports:
      - "8081:8081"
    depends_on:
      api:
        condition: service_started
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  robot-tests:
    image: python:3.13-alpine
    profiles:
      - test
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      BASE_URL: http://api:8080
      RESULT_DIR: robot-results
    command: >
      sh -lc "apk add --no-cache bash curl py3-virtualenv
      && ./scripts/wait-for-url.sh http://api:8080/actuator/health 90
      && ./scripts/run-e2e.sh"
    depends_on:
      api:
        condition: service_started
      worker:
        condition: service_started

  postgres:
    image: postgres:17-alpine
    container_name: task-processor-postgres
    environment:
      POSTGRES_DB: tasks
      POSTGRES_USER: task_user
      POSTGRES_PASSWORD: task_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U task_user -d tasks"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    container_name: task-processor-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: task_user
      RABBITMQ_DEFAULT_PASS: task_password
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  rabbitmq-data:
